# 项目基础配置
spring:
  application:
    name: game-card-sell

  # 默认激活开发环境配置
  profiles:
    active: dev

# MyBatis / MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mappers/**Mapper.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  type-aliases-package: com.liuao.game_card_sell.entity

# 自定义文件上传路径
file:
  upload-dir: uploads/
  access-path: /images/**

jwt:
  # 优先读取环境变量 JWT_SECRET_KEY，如果没读到则使用默认值（仅用于本地开发，生产环境务必通过环境变量传入）
  secret-key: ${JWT_SECRET_KEY:dev_secret_key_change_me_in_prod}
  # 过期时间（毫秒），这里保持你原来的 10 小时
  expiration-ms: 36000000
  # 用户ID的 claim 键名，方便以后修改
  user-id-claim: userId